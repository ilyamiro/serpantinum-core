[package]
name = "serpantinum-core"
version = "0.6.0"
edition = "2024"
description = "A core of services for Serpantinum shell in Rust."
license = "AGPL-3.0-or-later"
repository = "https://github.com/ilyamiro/serpantinum-core"

[dependencies]
blocking = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2"
rayon = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
# The pure-Rust backend, so the binary links only glibc and needs no libwayland at run time
wayland-client = "0.31"
zbus = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
